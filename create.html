<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create · LE TEXT PAGE</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="dashboard.html">LE TEXT PAGES</a>
    <div class="topbar-actions" style="margin-left:auto">
      <button class="account-btn" id="accountBtn">Account</button>
    </div>
  </header>

  <main class="create-page">
    <h1>Create Text Page</h1>
    <form class="create-form" id="createForm">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="titleInput" placeholder="Text name" required />
      </div>
      <div class="form-group">
        <label>Content</label>
        <textarea id="contentInput" placeholder="Write your text..." required></textarea>
      </div>

      <div class="file-zone" id="fileZone">
        Drop files here or click to attach<br>
        <small>Images, videos, any files · multiple · no size limit in this demo</small>
        <input type="file" id="fileInput" multiple hidden />
      </div>
      <div class="file-list" id="fileList"></div>

      <button type="submit" class="btn-publish" id="publishBtn">Publish</button>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = requireAuth("start.html");
    if (!user) throw new Error("not authed");

    document.getElementById("accountBtn").textContent = user.username;

    const fileZone = document.getElementById("fileZone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    let selectedFiles = [];

    fileZone.addEventListener("click", () => fileInput.click());
    fileZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      fileZone.classList.add("dragover");
    });
    fileZone.addEventListener("dragleave", () => fileZone.classList.remove("dragover"));
    fileZone.addEventListener("drop", (e) => {
      e.preventDefault();
      fileZone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", () => addFiles(fileInput.files));

    function addFiles(fileListObj) {
      for (const f of fileListObj) {
        selectedFiles.push(f);
      }
      renderFileList();
    }

    function renderFileList() {
      fileList.innerHTML = selectedFiles.map((f, i) => `
        <div class="file-item">
          <span>${escapeHtml(f.name)} (${(f.size / 1024).toFixed(1)} KB)</span>
          <button type="button" class="remove" data-i="${i}">×</button>
        </div>
      `).join("");
      fileList.querySelectorAll(".remove").forEach(btn => {
        btn.onclick = () => {
          selectedFiles.splice(+btn.dataset.i, 1);
          renderFileList();
        };
      });
    }

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("publishBtn");
      btn.disabled = true;
      btn.textContent = "Loading files...";

      try {
        const filesData = await readFilesAsDataUrls(selectedFiles);
        btn.textContent = "Publishing...";
        const page = createPage({
          title: document.getElementById("titleInput").value.trim(),
          content: document.getElementById("contentInput").value,
          userId: user.userId,
          username: user.username,
          files: filesData
        });
        window.location.href = "view.html?id=" + encodeURIComponent(page.textId) + "&from=dashboard";
      } catch (err) {
        alert("Failed to load files: " + err.message);
        btn.disabled = false;
        btn.textContent = "Publish";
      }
    });
  </script>
</body>
</html>
