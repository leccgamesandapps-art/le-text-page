<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pages · LE TEXT PAGE</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="dashboard.html">LE TEXT PAGES</a>
    <div class="topbar-actions" style="margin-left:auto">
      <button class="account-btn" id="accountBtn">Account</button>
    </div>
  </header>

  <main class="pages-page">
    <h1>My Pages</h1>
    <div class="page-list" id="pageList"></div>
    <div class="empty-state hidden" id="emptyState">
      You haven’t created any pages yet.
      <br><br>
      <a class="btn btn-primary" href="create.html">Create first page</a>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = requireAuth("start.html");
    if (!user) throw new Error("not authed");
    document.getElementById("accountBtn").textContent = user.username;

    const pages = getUserPages(user.userId);
    const list = document.getElementById("pageList");
    const empty = document.getElementById("emptyState");

    if (pages.length === 0) {
      empty.classList.remove("hidden");
    } else {
      list.innerHTML = pages.map(p => renderTextCard(p, "dashboard.html")).join("");
    }
  </script>
</body>
</html>
