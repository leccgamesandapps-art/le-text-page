<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · LE TEXT PAGES</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="dashboard.html">LE TEXT PAGES</a>
    <div class="topbar-search">
      <span class="search-icon">🔍</span>
      <input type="search" id="searchInput" placeholder="Search pages..." />
    </div>
    <div class="topbar-actions">
      <button class="btn-plus" id="plusBtn" title="Menu">+</button>
      <button class="account-btn" id="accountBtn">Account</button>
    </div>
  </header>

  <div class="plus-menu" id="plusMenu">
    <div class="plus-menu-header">
      <span>Menu</span>
      <button class="plus-menu-close" id="plusClose">×</button>
    </div>
    <div class="plus-menu-user" id="menuUser">—</div>
    <a href="create.html" id="menuCreate">Create</a>
    <a href="pages.html" id="menuPages">Pages</a>
    <a href="settings.html" id="menuSettings">Settings</a>
  </div>

  <main class="page-container">
    <div class="page-list" id="pageList"></div>
    <div class="empty-state hidden" id="emptyState">
      No public text pages yet. Create the first one!
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = requireAuth("start.html");
    if (!user) throw new Error("not authed");

    setupTopbar({ isDashboard: true });

    function renderList(filter = "") {
      const list = document.getElementById("pageList");
      const empty = document.getElementById("emptyState");
      let pages = getPublicPages();
      if (filter) {
        const q = filter.toLowerCase();
        pages = pages.filter(p =>
          (p.title || "").toLowerCase().includes(q) ||
          (p.username || "").toLowerCase().includes(q) ||
          (p.content || "").toLowerCase().includes(q)
        );
      }
      if (pages.length === 0) {
        list.innerHTML = "";
        empty.classList.remove("hidden");
      } else {
        empty.classList.add("hidden");
        list.innerHTML = pages.map(p => renderTextCard(p, "dashboard.html")).join("");
      }
    }

    renderList();
    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderList(e.target.value.trim());
    });

    // Handle ?view=textid
    const viewId = getQueryParam("view");
    if (viewId) {
      let url = "view.html?id=" + encodeURIComponent(viewId) + "&from=dashboard";
      const comment = getQueryParam("comment");
      if (comment) url += "&comment=" + encodeURIComponent(comment);
      window.location.href = url;
    }
  </script>
</body>
</html>
