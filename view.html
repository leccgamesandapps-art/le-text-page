<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View · LE TEXT PAGE</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="#" id="backLink">LE TEXT PAGES</a>
    <div class="topbar-actions" style="margin-left:auto">
      <button class="account-btn" id="accountBtn">Start</button>
    </div>
  </header>

  <main class="view-page" id="viewRoot">
    <div class="empty-state">Loading...</div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = getCurrentUser();
    const from = getQueryParam("from") || (user ? "dashboard" : "main");
    const textId = getQueryParam("id") || getQueryParam("view");
    const wantComment = getQueryParam("comment");

    document.getElementById("backLink").href = from === "dashboard" ? "dashboard.html" : "main.html";
    const accountBtn = document.getElementById("accountBtn");
    if (user) {
      accountBtn.textContent = user.username;
      accountBtn.onclick = () => location.href = "dashboard.html";
    } else {
      accountBtn.textContent = "Start";
      accountBtn.onclick = () => location.href = "start.html";
    }

    if (!textId) {
      document.getElementById("viewRoot").innerHTML = `<div class="empty-state">No text ID provided.</div>`;
      throw new Error("no id");
    }

    const page = getPage(textId);
    if (!page) {
      document.getElementById("viewRoot").innerHTML = `<div class="empty-state">Text page not found.</div>`;
      throw new Error("not found");
    }

    function renderAttachments(files) {
      if (!files || !files.length) return "";
      return `<div class="attachments">` + files.map(f => {
        if (f.type && f.type.startsWith("image/")) {
          return `<a href="${f.dataUrl}" target="_blank"><img src="${f.dataUrl}" alt="${escapeHtml(f.name)}" style="max-width:160px;max-height:120px;border-radius:8px;object-fit:cover"></a>`;
        }
        return `<a class="attachment" href="${f.dataUrl}" download="${escapeHtml(f.name)}">${escapeHtml(f.name)}</a>`;
      }).join("") + `</div>`;
    }

    function renderComments() {
      const comments = getComments(textId);
      const topLevel = comments.filter(c => !c.parentId);
      const byParent = {};
      comments.filter(c => c.parentId).forEach(c => {
        if (!byParent[c.parentId]) byParent[c.parentId] = [];
        byParent[c.parentId].push(c);
      });

      function renderOne(c, depth = 0) {
        const liked = user && c.likes && c.likes.includes(user.userId);
        const replies = byParent[c.commentId] || [];
        return `
          <div class="comment" data-id="${c.commentId}">
            <div class="comment-header">
              <span>${escapeHtml(c.username)}</span>
              <span>${formatDate(c.createdAt)}</span>
            </div>
            <div class="comment-body">${escapeHtml(c.content)}</div>
            ${renderAttachments(c.files)}
            <div class="comment-footer">
              <button class="like-btn ${liked ? "liked" : ""}" data-cid="${c.commentId}">
                ♥ ${c.likes ? c.likes.length : 0}
              </button>
              ${user ? `<button class="reply-btn" data-cid="${c.commentId}">Reply</button>` : ""}
            </div>
            ${replies.length ? `<div class="replies">${replies.map(r => renderOne(r, depth + 1)).join("")}</div>` : ""}
          </div>
        `;
      }

      return topLevel.map(c => renderOne(c)).join("") || `<p style="color:var(--text-muted)">No comments yet.</p>`;
    }

    function paint() {
      const canComment = !!user;
      document.getElementById("viewRoot").innerHTML = `
        <div class="view-header">
          <h1>${escapeHtml(page.title)}</h1>
          <div class="view-meta">
            by ${escapeHtml(page.username)} · ${formatDate(page.createdAt)}
            ${page.likes && page.likes.length ? ` · ${page.likes.length} likes` : ""}
          </div>
        </div>
        <div class="view-content">${escapeHtml(page.content)}</div>
        ${renderAttachments(page.files)}

        <div class="comments-section" style="margin-top:2rem">
          <h2>Comments</h2>
          ${canComment ? `
            <div class="comment-form" id="commentFormBox">
              <textarea id="commentInput" placeholder="Write a comment..."></textarea>
              <div class="comment-actions">
                <input type="file" id="commentFiles" multiple style="font-size:0.85rem" />
                <button class="btn btn-primary" id="postCommentBtn" style="padding:0.5rem 1rem">Post</button>
              </div>
              <input type="hidden" id="replyTo" value="" />
            </div>
          ` : `
            <p style="color:var(--text-muted);margin-bottom:1rem">
              <a href="start.html">Login / Register</a> to comment.
            </p>
          `}
          <div class="comment-list" id="commentList">${renderComments()}</div>
        </div>
      `;

      document.querySelectorAll(".like-btn").forEach(btn => {
        btn.onclick = () => {
          if (!user) {
            alert("Login to like");
            return;
          }
          toggleLikeComment(textId, btn.dataset.cid, user.userId);
          paint();
        };
      });

      document.querySelectorAll(".reply-btn").forEach(btn => {
        btn.onclick = () => {
          document.getElementById("replyTo").value = btn.dataset.cid;
          document.getElementById("commentInput").placeholder = "Replying...";
          document.getElementById("commentInput").focus();
        };
      });

      const postBtn = document.getElementById("postCommentBtn");
      if (postBtn) {
        postBtn.onclick = async () => {
          const content = document.getElementById("commentInput").value.trim();
          if (!content) return;
          const parentId = document.getElementById("replyTo").value || null;
          const fileInput = document.getElementById("commentFiles");
          let filesData = [];
          if (fileInput.files.length) {
            filesData = await readFilesAsDataUrls(fileInput.files);
          }
          addComment({
            textId,
            userId: user.userId,
            username: user.username,
            content,
            parentId,
            files: filesData
          });
          document.getElementById("commentInput").value = "";
          document.getElementById("replyTo").value = "";
          fileInput.value = "";
          paint();
        };
      }

      if (wantComment === "create" && canComment) {
        const box = document.getElementById("commentFormBox");
        if (box) box.scrollIntoView({ behavior: "smooth" });
        document.getElementById("commentInput")?.focus();
      }
    }

    paint();
  </script>
</body>
</html>
